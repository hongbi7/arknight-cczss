<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>罗德岛干员猜谜</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>罗德岛干员猜谜</h1>
  <p class="subtitle">根据 12 项档案线索，猜出谜底干员。支持拼音搜索（如 nts = 能天使）。</p>
</header>

<main>
  <section id="modeScreen">
    <h2 class="mode-title">选择游戏模式</h2>
    <div class="mode-cards">
      <button id="modeSudden" class="mode-card mode-hot">
        <span class="mode-badge">热门</span>
        <span class="mode-name">突然死亡模式</span>
        <span class="mode-desc">全干员池，限 5 次猜测<br>第 5 次后进入四选一终局，猜错即结束</span>
      </button>
      <button id="modeEndless" class="mode-card">
        <span class="mode-name">无尽模式</span>
        <span class="mode-desc">全干员池，不限猜测次数<br>靠 12 维线索一路逼近答案</span>
      </button>
    </div>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="game-meta">
      <span id="modeLabel" class="pill"></span>
      <span id="attemptLabel" class="pill"></span>
    </div>
    <div class="input-wrap">
      <input id="guessInput" placeholder="输入干员代号 / 拼音 / 首字母，如：能天使、nts" autocomplete="off">
      <button id="guessBtn">猜</button>
      <button id="revealBtn" class="ghost">放弃</button>
      <div id="suggest" class="suggest hidden"></div>
    </div>
    <p id="status" class="status"></p>

    <div class="table-wrap">
      <table id="board">
        <thead>
          <tr>
            <th>干员</th>
            <th>职业</th>
            <th>子职业</th>
            <th>星级</th>
            <th>站位</th>
            <th>Tag</th>
            <th>性别</th>
            <th>战斗经验</th>
            <th>出身地</th>
            <th>生日</th>
            <th>种族</th>
            <th>身高</th>
            <th>矿石病</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div id="victory" class="victory hidden">
      <h2 id="victoryText"></h2>
      <div class="victory-actions">
        <button id="restartBtn">再来一局</button>
        <button id="changeModeBtn" class="ghost">切换模式</button>
      </div>
    </div>
  </section>
</main>

<footer class="foot">数据来源：游戏内档案 · 纯粉丝向游戏 · 仅前端展示用</footer>

<div id="choiceModal" class="modal hidden">
  <div class="modal-box">
    <h3>最后一搏！</h3>
    <p class="modal-sub">5 次机会已用尽。从下面 4 名干员中选出谜底：</p>
    <div id="choiceList"></div>
    <button id="choiceGiveup" class="ghost">查看答案</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
