name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs may cancel tests or image uploads. ECS only accepts completed
# successful runs and serializes application releases independently.
concurrency:
  group: production-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-data.txt
            scripts/requirements-public-assets.txt

      - name: Install validation dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check -r scripts/requirements-data.txt -r scripts/requirements-public-assets.txt

      - name: Validate the committed data and assets without rebuilding
        run: |
          node -e 'if (require("./server-data/data-version.json").status !== "ready") { throw new Error("Production requires data status ready"); }'
          npm run validate:production
          npm run check:portraits

      - name: Install Nginx for image-routing integration checks
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Test game logic and deployment guard rails
        run: |
          npm test
          npm run test:deployment
          npm run test:images:pages
          python -m unittest discover -s tests/data-pipeline -p 'test_*.py'
          bash -n deploy/install.sh

      - name: Install Chromium for existing browser regressions
        run: npx playwright install --with-deps chromium

      - name: Exercise all three modes on desktop and mobile
        run: npx playwright test tests/e2e/original-modes.spec.js tests/e2e/anomaly-flow.spec.js tests/e2e/portrait-loading.spec.js

      - name: Retain validation and browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .update-work/production-validation.json
            output/playwright/report/
            output/playwright/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the commit eligible for ECS polling
        env:
          VALIDATED_COMMIT: ${{ github.sha }}
        run: |
          printf 'Validated commit: `%s`\n\n' "$VALIDATED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf 'When enabled, Cloudflare Pages image publication is also part of this CI result. ECS checks the successful main-branch run and deploys independently. This workflow does not report production deployment success.\n' >> "$GITHUB_STEP_SUMMARY"

  publish_images:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.IMAGE_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate Cloudflare Pages configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node -e 'const account=process.env.CLOUDFLARE_ACCOUNT_ID || ""; const project=process.env.CLOUDFLARE_PAGES_PROJECT || ""; if (!/^[0-9a-f]{32}$/i.test(account)) throw new Error("CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal account ID"); if (!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(project)) throw new Error("CLOUDFLARE_PAGES_PROJECT must be a DNS slug");'

      - name: Build the immutable image asset set
        run: node scripts/build_image_pages.js

      - name: Upload image assets to a unique Cloudflare Pages deployment
        id: pages
        # cloudflare/wrangler-action v4, resolved from its maintained v4 tag on 2026-09-09.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy output/cloudflare-pages
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=sha-${{ github.sha }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=false

      - name: Verify the remote image asset set and record its GitHub deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PAGES_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          IMAGE_PAGES_ASSET_SET_SHA256="$(node -p 'require("./output/cloudflare-pages/assets-manifest.json").assetSetSha256')"
          export IMAGE_PAGES_ASSET_SET_SHA256
          node scripts/record_image_pages.js
