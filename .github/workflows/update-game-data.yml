name: Update Arknights game data

on:
  schedule:
    - cron: "37 20 * * *"
  workflow_dispatch:

concurrency:
  group: arknights-game-data-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPDATE_BRANCH: automation/arknights-game-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Do not overwrite an unfinished update
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count="$(gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "An update PR is already open; leaving its local asset work untouched."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.open-pr.outputs.exists != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-data.txt
            scripts/requirements-public-assets.txt

      - name: Set up Node.js
        if: steps.open-pr.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install data dependencies
        if: steps.open-pr.outputs.exists != 'true'
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-data.txt -r scripts/requirements-public-assets.txt
          npm ci --ignore-scripts

      - name: Rebuild and validate public-source data
        if: steps.open-pr.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/update_game_data.py
          --data-only
          --report .update-work/data-update-report.json

      - name: Render update summary
        if: steps.open-pr.outputs.exists != 'true'
        run: >-
          python scripts/render_data_update_summary.py
          .update-work/data-update-report.json
          > .update-work/pull-request.md

      - name: Upload validation report
        if: steps.open-pr.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: arknights-data-report-${{ github.run_id }}
          path: |
            .update-work/data-update-report.json
            .update-work/public-asset-report.json
            server-data/data-version.json
          if-no-files-found: error
          retention-days: 30

      - name: Detect generated changes
        if: steps.open-pr.outputs.exists != 'true'
        id: changes
        shell: bash
        run: |
          mapfile -t generated_data_files < <(python scripts/validate_data_update.py --list-generated-files)
          git add -- \
            "${generated_data_files[@]}" \
            public/img/clues \
            public/img/factions \
            public/img/operators \
            server-data/data-version.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git commit -m "Update Arknights game data"
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" > /dev/null; then
            git fetch origin "+$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          fi
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

      - name: Open a draft pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          gh pr create
          --draft
          --base "$DEFAULT_BRANCH"
          --head "$UPDATE_BRANCH"
          --title "Update Arknights game data"
          --body-file .update-work/pull-request.md
